<!DOCTYPE html>
<html>
  <head>
    <link href="https://db.onlinewebfonts.com/c/c5c9157a20810aac79a10bf84a37bdb4?family=Neue+Montreal+Medium" rel="stylesheet"> 
    <link href="https://db.onlinewebfonts.com/c/86491e13bc132c38bdba0c2f57051023?family=GTSectra-Regular" rel="stylesheet"> 
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Carré 3D avec Three.js</title>

    <style>
      body { margin: 0; font-family: "GTSectra-Regular";  }
      section {
        height: 100vh;
        position: relative;
       

      }
      
      .background {
    height: 100%;
    width: 100%;
    background: linear-gradient(to bottom, #040e1d 0%, #1e0308 100%);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;

}
.blob {
    position: absolute;
    z-index: 999999999;
    top:0%;

left: 0%;   
 width: 30vw;
    height: 30vw;
    background-color: #d74e6716;
    border-radius: 50%;
    animation: blobMove 4s linear infinite;
    transform-origin: center;
    filter: blur(200px);
}

@keyframes blobMove {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform:scale(2.5);
    }
}
      canvas{
        position: fixed;
 top:0;
        z-index: 999;
        pointer-events: none;
      }

     .header{
        width: 96vw;
        margin-left: 2vw;
        height: 6vh;
    
        position: fixed;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 10px;
        letter-spacing: 1px;
        font-family: "Neue Montreal Medium"; 

     }
     .header div{
        width:33.33%;
        text-transform: uppercase;
     }
     .header div:nth-child(3){
      text-align: right;

     }
     .header div:nth-child(2){
      text-align: center;
      
     }
     h1{
        font-size: 5vw;
        width: 30%;
        text-align: right;
        line-height: 5vw;
        text-transform: uppercase;
        color: white;
        margin-left: 10%;
        margin-top: 10vw;color: #edcfcf;
     }
     h2 {
  font-size: 0.5vw;
  width: 8%;
 
  text-align: right;
  line-height: 0.55vw;
  text-transform: uppercase;
  color: white;
  font-family: 'Roboto', sans-serif;
  margin-left: 32%;
  font-weight: 500;
  margin-top: -1vw;color: #edcfcf;
}
    </style>
  </head>
  <body>

    <div class="header">
        <div>THREE.JS</div>
        <div>scrollsmoother</div>
        <div>scrolltrigger</div>

    </div>
    <div class="background"> </div>

<div id="smoothContent">
    <section class="section1">
     
            <h2 class='txt' data-speed="0.8" data-lag="0.4">Dogstudio is a multidisciplinary creative studio at the intersection of art, design and technology. </h2>
    </section>
    <section class="section2" ></section>
    <section></section>


</div>


    <script src="gsap.js"></script>
    <script src="ScrollTrigger.min.js"></script>
     <script src="ScrollSmoother.min.js"></script>


     

  

     <script type="module">

              import * as THREE from '../build/three.module.js';
        import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';
          
        import { Reflector } from './jsm/objects/Reflector.js';

gsap.registerPlugin(ScrollTrigger, ScrollSmoother);

var smoother =  ScrollSmoother.create({
  content: "#smoothContent",
  smooth: 2,
  effects: true

  });

  


      // Créer une scène
      const scene = new THREE.Scene();

      // Créer une caméra
      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 1, 10000);
camera.position.set(0, 0.5, 2); // Utilisation de la méthode set pour définir la position
camera.rotation.set(-1, 0, 0); 
camera.rotation.x = -0.8;            
      // Créer un rendu
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

    


const container = new THREE.Object3D();
scene.add(container);



// Positionnez le Reflector
const reflectorGeometry = new THREE.PlaneGeometry(1, 1);
const reflectorGeometry2 = new THREE.PlaneGeometry(0.5, 0.5);
const reflector = new Reflector(reflectorGeometry, {
  textureWidth: window.innerWidth * window.devicePixelRatio,
  textureHeight: window.innerHeight * window.devicePixelRatio,
  color: 0xffffff,
});
const reflector2 = new Reflector(reflectorGeometry2, {
  textureWidth: window.innerWidth * window.devicePixelRatio,
  textureHeight: window.innerHeight * window.devicePixelRatio,
  color: 0xffffff,
});
reflector.position.set(-1, 0, 0);
reflector2.position.set(0.3, 0.6,0.9);
// Orientez le Reflector vers le haut
//reflector.rotateX(Math.PI / 2.8);
reflector.rotateY(Math.PI/3 );
reflector2.rotateY(Math.PI*1.58 );
reflector2.rotateX(Math.PI*2.2 );
scene.add(reflector);scene.add(reflector2);


//creation materiel
const material = new THREE.MeshStandardMaterial({
  color: 0xeeeeee,
  metalness: 0.1, // 1 pour un matériau métallique
  roughness: 0.2, // Rugosité (0 à 1, 0 = lisse, 1 = rugueux)
});

///////////////////////////////////////////////////SOL

// Créez la géométrie du sol (un plan)
const groundGeometry = new THREE.PlaneGeometry(10, 10); // Largeur et longueur du sol

// Créez un matériau pour le sol
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xeeeeee,
  metalness: 0.8, // 1 pour un matériau métallique
  roughness: 0.2, // Rugosité (0 à 1, 0 = lisse, 1 = rugueux)

    side: THREE.DoubleSide, // Rendre le sol visible des deux côtés
});

// Créez un mesh (objet) pour le sol en utilisant la géométrie et le matériau
const ground = new THREE.Mesh(groundGeometry, groundMaterial);

// Positionnez le sol (par exemple, au niveau du sol)
ground.position.set(0, -1, 5);
// Ajustez la rotation pour mettre le sol à plat
ground.rotation.x = -Math.PI / 2;
// Ajoutez le sol à la scène
scene.add(ground);



//:light
// Créez une lumière ambiante
const ambientLight = new THREE.AmbientLight(0x404040); // Couleur de la lumière ambiante en hexadécimal
ambientLight.intensity = 0; 
// Ajoutez la lumière ambiante à la scène
scene.add(ambientLight);


const directionalLight = new THREE.DirectionalLight(0xffffff, 0.9); // Couleur blanche avec une intensité de 1
directionalLight.position.set(1, 1, 1); // Position de la lumière directionnelle
scene.add(directionalLight);


const loader = new GLTFLoader();

let mixer; // Déclarez une variable pour stocker l'animation mixer
// Charger le modèle
loader.load('D.glB', (gltf) => {
  const model = gltf.scene;
      // Changer la taille du modèle
      const scale = 0.4; // Modifiez cette valeur en fonction de la taille souhaitée

model.scale.set(scale, scale, scale);
model.position.y=-0.2



model.traverse((child) => {
    if (child instanceof THREE.Mesh) {
      child.material = material;
    }
    if (child === model.children[1]) {
            // Utilisez la géométrie du child pour le réflecteur
            const reflectorGeometry = child.geometry;

            // Créez un réflecteur à partir de la géométrie
            const reflector = new Reflector(reflectorGeometry, {
                textureWidth: window.innerWidth * window.devicePixelRatio,
                textureHeight: window.innerHeight * window.devicePixelRatio,
                color: 0xffffff,
            });
         // Définissez la position du réflecteur pour correspondre à la position de l'enfant
       reflector.position.set(0,-0.4,-5);
       reflector.rotateX(-Math.PI/0.62 );

            container.add(reflector);

            // Désactivez ou masquez l'enfant du modèle (facultatif)
            child.visible = false; // Cela masquera l'enfant
            const animate = () => {
              const time = Date.now();
             reflector.position.x =0+Math.cos( time * 0.001 ) * 0.3;
             reflector.position.y =-0.2+Math.cos( time * 0.001 ) * 0.1;


  renderer.render(scene, camera);
  requestAnimationFrame(animate);
};

animate();
   
        }
        if (child === model.children[3]) {
            // Utilisez la géométrie du child pour le réflecteur
            const reflectorGeometry = child.geometry;
            

            // Créez un réflecteur à partir de la géométrie
            const reflector9 = new Reflector(reflectorGeometry, {
                textureWidth: window.innerWidth * window.devicePixelRatio,
                textureHeight: window.innerHeight * window.devicePixelRatio,
                color: 0x00000000,
            });
         // Définissez la position du réflecteur pour correspondre à la position de l'enfant
       reflector9.position.set(-1,1.2,-1);
       reflector9.scale.set(1,1,1);
       reflector9.rotateX(-Math.PI/0.61 );
  
            container.add(reflector9);

            // Désactivez ou masquez l'enfant du modèle (facultatif)
            child.visible = false; // Cela masquera l'enfant
            // ou
            // scene.remove(child); // Cela le retirera de la scène
 
        }
   
   
  });




  mixer = new THREE.AnimationMixer(model);
  let totalDuration ;


  gltf.animations.forEach((clip) => {
    const action = mixer.clipAction(clip);

  // Mettre l'animation en pause au début après avoir mis en play
  action.play();
  action.paused = true;
  totalDuration = clip.duration;///elles ont toute la meme duree




  gsap.to(action, {
    time: totalDuration , // Définissez ici le pourcentage de progression souhaité (0 à 1)
  
  scrollTrigger: {
    trigger: ".section1",
    start: "top 20%",
    end: "+=150%",
    scrub:true,
    markers: true
  }
});
  });

// gsap.to (model.scale,
//     {
//         x:  0.2, // Rotation de 360 degrés autour de l'axe X
//   y: 0.2, // Rotation de 360 degrés autour de l'axe Y
 
//    scrollTrigger:{
//     trigger: '.section1',
//     start: "40% center",
//     end: "center 10%",
//     scrub:true,

//               }
    
//     })

  container.add(model);

  // Vous pouvez ajouter des transformations, des matériaux, etc. au modèle ici
}, undefined, (error) => {
  console.error('Erreur de chargement du modèle:', error);
});









gsap.to (".txt",
    {
    
   scrollTrigger:{
    trigger: ".txt",
    start: "0% 7%",
    end: "+=500%",
    scrub:true,
    pin:true,
 
              }
    
    })




   
    const mouse = { x: 0, y: 0 };

document.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX ;
    mouse.y = e.clientY ;

    // Utilisez la position de la souris pour effectuer des modifications légères
    const rotationIntensity = 0.09; // Augmentez cette valeur pour un effet plus fort

  gsap.to (   camera.rotation,
    {
      duration:2,
     x: -0.2+(mouse.y / window.innerHeight - 0.5) * rotationIntensity,
     y:(mouse.x / window.innerWidth - 0.5) * rotationIntensity,
    
    })
    // Mettez à jour la scène
    renderer.render(scene, camera);
});




const clock = new THREE.Clock();
      // Animation
      const animate = () => {
        const time = Date.now();
     // container.rotation.x += 0.001;
  // container.rotation.y += 0.001;

  reflector2.rotation.x += Math.cos( time * 0.001 ) * 0.01;
  reflector2.position.x =1+Math.cos( time * 0.001 ) * 0.2;

  if (mixer) {
    const delta = clock.getDelta(); // Utilisez une instance de Clock pour suivre le temps
    mixer.update(delta);
  }

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };

      animate();

      //agrandir la scene en fonction de la fenetre

      window.addEventListener('resize', (event) => {
  const newWidth = window.innerWidth;
  const newHeight = window.innerHeight;

  renderer.setSize(newWidth, newHeight);

  child.material = reflectorMaterial;

  // Mettez à jour le rapport d'aspect de la caméra
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
});

    </script>
  </body>
</html>
