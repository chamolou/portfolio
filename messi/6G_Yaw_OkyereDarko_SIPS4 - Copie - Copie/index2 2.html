<!DOCTYPE html>
<html>
  <head>
    <link href="https://db.onlinewebfonts.com/c/c5c9157a20810aac79a10bf84a37bdb4?family=Neue+Montreal+Medium" rel="stylesheet"> 
    <link href="https://db.onlinewebfonts.com/c/86491e13bc132c38bdba0c2f57051023?family=GTSectra-Regular" rel="stylesheet"> 
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Carré 3D avec Three.js</title>

    <style>
      body { margin: 0; font-family: "GTSectra-Regular";  }
      section {
        height: 100vh;
        position: relative;
       

      }
      
      .background {
    height: 100%;
    width: 100%;
    background: linear-gradient(to bottom, #0f2647 0%, #d74e67 100%);
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;

}
.blob {
    position: absolute;
    z-index: 999999999;
    top:0%;

left: 0%;   
 width: 30vw;
    height: 30vw;
    background-color: #d74e6716;
    border-radius: 50%;
    animation: blobMove 4s linear infinite;
    transform-origin: center;
    filter: blur(200px);
}

@keyframes blobMove {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform:scale(2.5);
    }
}
      canvas{
        position: fixed;
 top:0;
        z-index: 999;
        pointer-events: none;mix-blend-mode: overlay;
      }

     .header{
        width: 96vw;
        margin-left: 2vw;
        height: 6vh;
    
        position: fixed;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 10px;
        letter-spacing: 1px;
        font-family: "Neue Montreal Medium"; 

     }
     .header div{
        width:33.33%;
        text-transform: uppercase;
     }
     .header div:nth-child(3){
      text-align: right;

     }
     .header div:nth-child(2){
      text-align: center;
      
     }
     h1{
        font-size: 5vw;
        width: 30%;
        text-align: right;
        line-height: 5vw;
        text-transform: uppercase;
        color: white;
        margin-left: 10%;
        margin-top: 10vw;color: #edcfcf;
     }
     h2 {
  font-size: 0.5vw;
  width: 8%;
 
  text-align: right;
  line-height: 0.55vw;
  text-transform: uppercase;
  color: white;
  font-family: 'Roboto', sans-serif;
  margin-left: 32%;
  font-weight: 500;
  margin-top: -1vw;color: #edcfcf;
}
    </style>
  </head>
  <body>
    <div class="blob" data-speed="0.5"> </div>
    <div class="header">
        <div>THREE.JS</div>
        <div>scrollsmoother</div>
        <div>scrolltrigger</div>

    </div>
    <div class="background"> </div>

<div id="smoothContent">
    <section class="section1">
        <h1 data-speed="1" data-lag="0.8">We<br>
            try<br>
            Good<br>
            things</h1>
            <h2 class='txt' data-speed="0.8" data-lag="0.4">Dogstudio is a multidisciplinary creative studio at the intersection of art, design and technology. </h2>
    </section>
    <section class="section2" ></section>
    <section></section>


</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="gsap.js"></script>
    <script src="ScrollTrigger.min.js"></script>
     <script src="ScrollSmoother.min.js"></script>




    <script>
gsap.registerPlugin(ScrollTrigger, ScrollSmoother);

var smoother =  ScrollSmoother.create({
  content: "#smoothContent",
  smooth: 2,
  effects: true

  });

  


      // Créer une scène
      const scene = new THREE.Scene();

      // Créer une caméra
      const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 3;

      // Créer un rendu
      const renderer = new THREE.WebGLRenderer({ alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

    

      //agrandir la scene en fonction de la fenetre

      window.addEventListener('resize', (event) => {
  const newWidth = window.innerWidth;
  const newHeight = window.innerHeight;

  renderer.setSize(newWidth, newHeight);

  // Mettez à jour le rapport d'aspect de la caméra
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
});


const container = new THREE.Object3D();
scene.add(container);

// Créer un cube
const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
// Shader pour le matériau personnalisé
const material = new THREE.MeshStandardMaterial({
  color: 0xeeeeee,
  metalness: 1, // 1 pour un matériau métallique
  roughness: 0.2, // Rugosité (0 à 1, 0 = lisse, 1 = rugueux)
});
const cube = new THREE.Mesh(geometry, material);
container.add(cube);

//:light
const directionalLight = new THREE.DirectionalLight(0xffffff, 100); // Couleur blanche avec une intensité de 1
directionalLight.position.set(1, 1, 1); // Position de la lumière directionnelle
scene.add(directionalLight);





    gsap.to (cube.rotation,
    {
        x: "+=" + Math.PI * 2, // Rotation de 360 degrés autour de l'axe X
  y: "+=" +  Math.PI * 2, // Rotation de 360 degrés autour de l'axe Y
 
   scrollTrigger:{
    trigger:'.section2',
    start:"top center",
    end:"center 10%",
    scrub:true,

              }
    
    })

 
    gsap.to (cube.scale,
    {
        x:  2, // Rotation de 360 degrés autour de l'axe X
  y: 2, // Rotation de 360 degrés autour de l'axe Y
 
   scrollTrigger:{
    trigger: '.section1',
    start: "40% center",
    end: "center 10%",
    scrub:true,

              }
    
    })


gsap.to (".txt",
    {
    
   scrollTrigger:{
    trigger: ".txt",
    start: "0% 7%",
    end: "+=500%",
    scrub:true,
    pin:true,
 
              }
    
    })

    let currentRotation = { x: 0, y: 0 };

      // Animation
      const animate = () => {
       
        container.rotation.x += 0.005;
  container.rotation.y += 0.005;

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };

      animate();

    </script>
  </body>
</html>
