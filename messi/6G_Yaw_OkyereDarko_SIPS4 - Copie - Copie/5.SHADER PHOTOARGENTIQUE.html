<html>
<head>
    <meta charset="utf-8">

        }

            position: fixed;

</head>
<body>
    <div id="changeTextureButton"></div>
    <div id="container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/stats.js"></script>


    <script>
        const scene = new THREE.Scene();
    

            const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
           camera.position.z = 205;


        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

     
 













        
      
  
    ///texture image pour le shader 
    const textures = [
            new THREE.TextureLoader().load('cubemap/image2/46545.png'),
            new THREE.TextureLoader().load('cubemap/image2/46545.png'), // Ajoutez ici le chemin de votre deuxième image
  
        ];
        
     let currentTextureIndex = 0;
    const textureCount = textures.length;
      
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;


        const fragmentShader = `
uniform sampler2D uTexture1;
uniform sampler2D uTexture2;
uniform float uMixValue;
uniform float uTime;
uniform float uAmplitudeDeformation;
uniform vec2 uScreenSize;
uniform vec2 uBGSize;
varying vec2 vUv;

void main() {

  vec2 uv = vUv;


  vec2 uv1 = uv; // Copie des coordonnées pour uTexture1
 uv.x += sin(uv1.y * 10.0 + uTime) * uAmplitudeDeformation;

 vec2 uv2 = uv; // Copie des coordonnées pour uTexture2
 uv2.x += sin(uv1.y * 10.0 + uTime) * uAmplitudeDeformation;
 
  vec2 s = uScreenSize;
  vec2 i = uBGSize;
  float rs = s.x / s.y;
  float ri = i.x / i.y;
  vec2 newSize = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
  vec2 screenOffset = rs < ri ? vec2((newSize.x - s.x) / 2.0, 0.0) : vec2(0.0, (newSize.y - s.y) / 2.0);
  uv = (uv * s / newSize) + (screenOffset / s);

  vec4 texColor1 = texture2D(uTexture1, uv);
vec4 texColor2 = texture2D(uTexture2, uv);




  // Combinez les deux textures comme vous le souhaitez, par exemple, une simple interpolation :
  vec4 finalColor = mix(texColor1, texColor2, uMixValue) ;

  gl_FragColor = finalColor;
}
`;

// Créez un ShaderMaterial avec les uniforms pour la taille de l'écran et la taille de l'image

const uniforms = {
  uTexture1: { value: textures[0] },
  uTexture2: { value: textures[1] },
  uScreenSize: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  uBGSize: { value: new THREE.Vector2(3000, 2000) },
  uMixValue: { value: 0 },
  uTime: { value: 0.5 },
  uAmplitudeDeformation: { value: 0.01 },
};

const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
  vertexShader: vertexShader,
  fragmentShader: fragmentShader,
  transparent: true,
});


// ///aniamtion de treasnitionde texture
//gsap.to (uniforms.  uMixValue,{value:1,duration:2})


// ///deforamtion de la vitesse de l'ondualtion speed
 //gsap.to(uniforms. uTime, { value: 5, duration: 1 });


// ///deforamtion de la vitesse de l'ondualtion amplitude
//gsap.from(uniforms. uAmplitudeDeformation, { value: 0.9, duration: 3, ease: "power4.out", });





// Fonction pour ajuster la géométrie du plan en fonction de la caméra
function planeFitPerspectiveCamera(x, camera, relativeZ = null) {
  const cameraZ = relativeZ !== null ? relativeZ : camera.position.z;
  const distance = cameraZ - x.position.z;
  const vFov = camera.fov * (Math.PI / 180);
  const scaleY = 2 * Math.tan(vFov / 2) * distance;
  const scaleX = scaleY * camera.aspect;

 x.scale.set(scaleX*1.1, scaleY*1.1, 1);

}

// Créez le plan
const geometry = new THREE.PlaneGeometry(1.1, 1.1); // Utilisez une géométrie de base (1x1)
const plane = new THREE.Mesh(geometry, material);
// Ajustez la géométrie du plan en fonction de la caméra
planeFitPerspectiveCamera(plane, camera);

scene.add(plane);




const displacementMapTexture = new THREE.TextureLoader().load('displacement/texturetrans.png');
const textureTrans =  new THREE.TextureLoader().load('cubemap/image2/46545.png');

// Vertex shader
const vertexShader2 = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;


// Fragment shader
// Fragment shader

const fragmentShader2 = `
uniform sampler2D displacementMap;
uniform sampler2D uTexture1;

uniform float uYo;
uniform float time;  // Cette variable de temps peut être utilisée pour l'animation
uniform float uTextureOffsetX;   // Ajustez ce décalage horizontal selon vos besoins
uniform float uTextureOffsetY;   // Ajustez ce décalage vertical selon vos besoins
uniform vec2 uScreenSize;
uniform vec2 uBGSize;
varying vec2 vUv;
void main() {
    vec2 uv = vUv;
    

    vec2 s = uScreenSize;
  vec2 i = uBGSize;
  float rs = s.x / s.y;
  float ri = i.x / i.y;
  vec2 newSize = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
  vec2 screenOffset = rs < ri ? vec2((newSize.x - s.x) / 2.0, 0.0) : vec2(0.0, (newSize.y - s.y) / 2.0);
  uv = (uv * s / newSize) + (screenOffset / s);


    // Ajustez les coordonnées de texture pour la carte de déplacement
    vec2 displacementUv = uv *0.99;
    displacementUv.x += uTextureOffsetX;  // Décalage horizontal
    displacementUv.y += uTextureOffsetY;  // Décalage vertical

    // Échantillonnez la texture de déplacement
    vec4 displacementColor = texture2D(displacementMap, displacementUv);

    // Ajustez les coordonnées de texture pour l'effet de déformation
    uv.x += displacementColor.r * uYo;  // Utilisez la composante rouge (R) pour le déplacement horizontal
    uv.y += displacementColor.g * uYo;  // Utilisez la composante verte (G) pour le déplacement vertical

    // Échantillonnez la texture1 avec les coordonnées de texture déformées
    vec4 color = texture2D(uTexture1, uv);

    // Définissez un facteur de transparence basé sur la luminosité des zones grises lr fzacteur est 3.0 en ce moment
    float grayValue = (displacementColor.r + displacementColor.g + displacementColor.b) / 2.9;
    float transparency = 1.0 - grayValue;  // Inversez la luminosité pour la transparence

    // Appliquez la transparence aux pixels de la texture1
    color.a *= transparency;



    // Maintenant, appliquez la couleur ajustée avec la transparence
    gl_FragColor = color;
}


`;

// Créez un matériau personnalisé pour plane2
const customMaterial = new THREE.ShaderMaterial({
    uniforms: {

        uScreenSize: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
         uBGSize: { value: new THREE.Vector2(3000, 2000) },
        displacementMap: { value: displacementMapTexture },
        uTexture1: { value: textureTrans },
        time:{value:0.5},
        uYo: { value: 0.1 },
        uTextureOffsetX: { value: -0.3 },
        uTextureOffsetY: { value: 0.0 }, 
  
    },
    vertexShader: vertexShader2,
    fragmentShader: fragmentShader2, 
     transparent: true, // Définir le matériau comme transparent
  side: THREE.DoubleSide, // Vous pouvez changer cette option en fonction de vos besoins
  depthWrite: false, 
});




const plane2 = new THREE.Mesh(geometry, customMaterial);
plane2.position.z = 2;
planeFitPerspectiveCamera(plane2, camera);

scene.add(plane2);

//gsap.to(customMaterial.uniforms.time, { value: 0.1 , duration: 10 });

// Désactivez l'écriture dans le tampon de profondeur pour que les objets derrière soient visibles
plane2.material.depthWrite = false;

        ///////////redimensionnemtn

// Redimensionnement du rendu lorsque la fenêtre change de taille
function onWindowResize() {
    const newWidth = window.innerWidth;
    const newHeight = window.innerHeight;

    // Mettez à jour la taille du rendu et la caméra
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
 planeFitPerspectiveCamera(plane, camera);
 planeFitPerspectiveCamera(plane2, camera);
    renderer.setSize(newWidth, newHeight);

     customMaterial.uniforms.uScreenSize.value.x = newWidth;
 customMaterial.uniforms.uScreenSize.value.y = newHeight;
      // Mettez à jour les uniforms de la taille de l'écran dans le shader
  material.uniforms.uScreenSize.value.x = newWidth;
  material.uniforms.uScreenSize.value.y = newHeight;

}

// Écouteur d'événement pour le redimensionnement de la fenêtre
window.addEventListener('resize', onWindowResize);

// Appelez onWindowResize() une fois au début pour initialiser la taille du rendu
onWindowResize();




















const mouse = { x: 0, y: 0 };

document.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX || e.pageX;
    mouse.y = e.clientY || e.pageY;

    // Utilisez la position de la souris pour effectuer des modifications légères
    const rotationIntensity = 0.1; // Augmentez cette valeur pour un effet plus fort

  gsap.to (   camera.rotation,
    {
      duration:2,
     x: (mouse.y / window.innerHeight - 0.5) * rotationIntensity,
     y:(mouse.x / window.innerWidth - 0.5) * rotationIntensity,
    
    })
    gsap.to(customMaterial.uniforms. uTextureOffsetX, {
            value:(mouse.x / window.innerWidth  - 0.5) * rotationIntensity*2,
            duration:10,
            ease: "none", ease: "power4.out",
         
     
            
       });
       gsap.to(customMaterial.uniforms. uTextureOffsetY, {
            value:(mouse.y / window.innerHeight  - 0.5) * rotationIntensity*2,
            duration:3,
            ease: "none", ease: "power4.out",
        
     
            
       });

       gsap.to(customMaterial.uniforms. uYo, {
        value:(mouse.x / window.innerWidth  - 0.5) * rotationIntensity*1,
            duration:3,
            ease: "none", ease: "power4.out",
         
     
            
       });

    // Mettez à jour la scène
    renderer.render(scene, camera);
});















        const stats = new Stats();
        document.body.appendChild( stats.dom ).setAttribute("id", "democlass"); ;
			
            democlass.style.top='750px'
            democlass.style.left='80px'
    democlass.style.opacity=1;



    let increasing = true; 

        function animate() {
        

            const time2 =  performance.now() * 0.0001;



///////////deformatino
          uniforms.uTime.value += 0.01; 
  
   

            stats.begin()
            renderer.render(scene, camera);
            stats.end();
            requestAnimationFrame(animate);
        }

        animate();

           


    </script>
</body>
</html>
