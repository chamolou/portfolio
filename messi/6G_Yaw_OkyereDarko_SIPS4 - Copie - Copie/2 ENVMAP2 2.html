<!DOCTYPE html>
<html>
  <head>
    <link href="https://db.onlinewebfonts.com/c/c5c9157a20810aac79a10bf84a37bdb4?family=Neue+Montreal+Medium" rel="stylesheet"> 
    <link href="https://db.onlinewebfonts.com/c/86491e13bc132c38bdba0c2f57051023?family=GTSectra-Regular" rel="stylesheet"> 
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Carré 3D avec Three.js</title>

    <style>
      body { margin: 0; font-family: "GTSectra-Regular";  }
      section {
        height: 100vh;
        position: relative;
       

      }
      .gsap-marker-start{
        z-index: 99999999999;
        position: relative;
      }
      .background {
    height: 100%;
    width: 100%;
 
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;

}

      canvas{
        position: fixed;
 top:0;
        z-index: -1;
        pointer-events: none;
      }

     .header{
        width: 96vw;
        margin-left: 2vw;
        height: 6vh;
    
        position: fixed;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 10px;
        letter-spacing: 1px;
        font-family: "Neue Montreal Medium"; 

     }
     .header div{
        width:33.33%;

     }
     .header div:nth-child(3){
      text-align: right;

     .header div:nth-child(2){

     }
     section{
      position: relative;
     }
     h1{
        font-size: 5vw;
        width: 30%;
        text-align: right;
        line-height: 5vw;
        text-transform: uppercase;
        color: white;
        margin-left: 10%;
        margin-top: 10vw;color: #edcfcf;
     }
     h2 {
  font-size: 0.5vw;
  width: 8%;
 
  text-align: right;
  line-height: 0.55vw;
  text-transform: uppercase;
  color: white;
  font-family: 'Roboto', sans-serif;
  margin-left: 32%;
  font-weight: 500;
  margin-top: -1vw;color: #edcfcf;
}
#carre{
  width: 150px;
  height: 150px;
  background-color: blueviolet;
  position:relative;


}
    </style>
  </head>
  <body>

    <div class="header">
        <div>THREE.JS</div>
        <div>scrollsmoother</div>
        <div>scrolltrigger</div>

    </div>


<div id="smoothContent">

    <section class="section1">
  
        <h1 data-speed="1" data-lag="0.8">We<br>
            try<br>
            Good<br>
            things</h1>
            <h2 class='txt' data-speed="0.8" data-lag="0.4">Dogstudio is a multidisciplinary creative studio at the intersection of art, design and technology. </h2>
    </section>
    <section class="section2" >
      <div id="carre"></div>
    </section>
    <section></section>


</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="gsap.js"></script>
    <script src="ScrollTrigger.min.js"></script>
     <script src="ScrollSmoother.min.js"></script>

     <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
     



    <script>
gsap.registerPlugin(ScrollTrigger, ScrollSmoother);

var smoother =  ScrollSmoother.create({
  content: "#smoothContent",
  smooth: 2,
  effects: true

  });


  
    // Déclarez une variable pour stocker l'animation
    let mixer; 
    const loader = new THREE.GLTFLoader();

  const loader2 = new THREE.CubeTextureLoader();
  loader2.setPath( 'cubemap/' );
  const textureCube = loader2.load(['image1/px.png', 'image1/nx.png','image1/py.png', 'image1/ny.png','image1/pz.png', 'image1/nz.png']);
  const textureCube2 = loader2.load(['image2/px.png', 'image2/nx.png','image2/py.png', 'image2/ny.png','image2/pz.png', 'image2/nz.png']);


init()

function init(){


      // Créer une scène
      const scene = new THREE.Scene();
      textureCube.mapping = THREE.CubeRefractionMapping;
      textureCube2.mapping = THREE.CubeRefractionMapping;
      textureCube.minFilter = THREE.LinearFilter;


      camera = new THREE.PerspectiveCamera( 120, window.innerWidth / window.innerHeight,1, 1000 );
			camera.position.z = 10;
   
      const container = new THREE.Object3D();
      scene.add(container);


        /////CUBE IMAGES FOND

        // Créer un cube
        const geometry = new THREE.BoxGeometry(window.innerWidth , window.innerHeight, 1);
        // Créer le matériau du cube
          const material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            metalness: 1,
            roughness: 0,
            envMap: textureCube // Utilisez la texture cube pour l'environnement
          });
          // Créer le cube avec le matériau
          const cube = new THREE.Mesh(geometry, material);
          cube.position.z = 1;
          scene.add(cube);



        const material2 =  new THREE.MeshPhongMaterial( { color: 0xfffffd,flatShading:true, envMap:  textureCube, reflectivity:1,refractionRatio: 0.9 } );
    


          // Charger le modèle  // Charger le modèle  // Charger le modèle  // Charger le modèle  // Charger le modèle  // Charger le modèle
          // Charger le modèle  // Charger le modèle  // Charger le modèle  // Charger le modèle  // Charger le modèle  // Charger le modèle


          loader.load('cubemapblender.glb', (gltf) => {
           
           
          const model = gltf.scene;
          const scale =50; 
          model.scale.set(scale, scale, scale);
          model.position.y=-0
          container.add(model);



          ///recuperer les elements du model 3d (child)


          model.traverse((child) => {

          if (child instanceof THREE.Mesh) {


            child.material = material2; //application du material2 (meshphong avec refraction)

              
            ///cahnger la reference image dans material2 (object blender child)
                gsap.to('#carre', {
              scrollTrigger: {
                trigger: '#carre',
                  start: 'top 10%',
                  end: 'bottom 10%',
                  scrub: true,
               markers:true,

               onEnter: () =>  { 
                material2.envMap= textureCube2
                material.envMap= textureCube2
              
              },
              onEnterBack: () =>  { 
                material2.envMap= textureCube
                material.envMap= textureCube
              
              },

                    },
                });

              }
            }); ///fin  de  model.traverse


            ////animation
            mixer = new THREE.AnimationMixer(model);
            let totalDuration ;

                  gltf.animations.forEach((clip) => {
                  const action = mixer.clipAction(clip);
                  // Mettre l'animation en pause au début après avoir mis en play
                  action.play();
                  action.paused = true;
                  totalDuration = clip.duration;///elles ont toute la meme duree

                  gsap.to(action, {
                  
                  time: totalDuration , 
                  scrollTrigger: {
                    trigger: ".section1",
                    start: "top 20%",
                    end: "+=100%",
                    scrub:true,
                  // markers: true
                  }
                });

                  });
            
      
          }, undefined, (error) => {
            console.error('Erreur de chargement du modèle:', error);
          });










//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light
//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light//:light


const ambient = new THREE.AmbientLight( 0xffffff, 1);
			scene.add( ambient );



 //////SCROLLTRIGE ELEMENT HTML//////SCROLLTRIGE ELEMENT HTML //////SCROLLTRIGE ELEMENT HTM //////SCROLLTRIGE ELEMENT HTML
//////SCROLLTRIGE ELEMENT HTML//////SCROLLTRIGE ELEMENT HTML //////SCROLLTRIGE ELEMENT HTM //////SCROLLTRIGE ELEMENT HTML    
 gsap.to (".txt",
              {
              
            scrollTrigger:{
              trigger: ".txt",
              start: "0% 7%",
              end: "+=500%",
              scrub:true,
              pin:true,
          
                        }
              
              })



////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS
////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS////+SOURIS
   
    const mouse = { x: 0, y: 0 };

document.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX || e.pageX;
    mouse.y = e.clientY || e.pageY;

    // Utilisez la position de la souris pour effectuer des modifications légères
    const rotationIntensity = 0.29; // Augmentez cette valeur pour un effet plus fort

  gsap.to (   camera.rotation,
    {
      duration:2,
     x: (mouse.y / window.innerHeight - 0.5) * rotationIntensity,
     y:(mouse.x / window.innerWidth - 0.5) * rotationIntensity,
    
    })
    // Mettez à jour la scène
    renderer.render(scene, camera);
});





///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU
///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU///CREATION RENDU

   renderer = new THREE.WebGLRenderer();			
   renderer.setPixelRatio( window.devicePixelRatio );
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);


       //agrandir la scene en fonction de la fenetre

       window.addEventListener('resize', (event) => {
      const newWidth = window.innerWidth;
      const newHeight = window.innerHeight;

      renderer.setSize(newWidth, newHeight);

      // Mettez à jour le rapport d'aspect de la caméra
      camera.aspect = newWidth / newHeight;
      camera.updateProjectionMatrix();
});



//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE
//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE//ANIMATE

      const clock = new THREE.Clock();
      // Animation
      const animate = () => {
       
        //container.rotation.x += 0.005;
  //container.rotation.y += 0.005;
  const time2 = - performance.now() * 0.0009;
  container.rotation.x = Math.cos( time2 * 0.1 ) * 1;
  //container.rotation.y += 0.001;
  container.rotation.z = Math.sin( time2 * 0.05 ) * 3.14;


  if (mixer) {
    const delta = clock.getDelta(); // Utilisez une instance de Clock pour suivre le temps
    mixer.update(delta);
  }
      
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      };

      animate();
    }
    </script>
  </body>
</html>
