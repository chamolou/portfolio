<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Effet de Déformation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

     
   const geometry = new THREE.PlaneGeometry(5, 5);
        const texture = new THREE.TextureLoader().load('cubemap/image2/46545.png');
  
        // Shader personnalisé pour la déformation
    // Shader personnalisé pour la déformation, le défilement latéral et la taille ajustée
    const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform sampler2D uTexture;
            uniform float uTime; // Temps pour l'animation
            uniform float uOffset; // Décalage latéral
            uniform vec2 uScale; // Ajustement de la taille
            varying vec2 vUv;
            void main() {
                vec2 uv = vUv;

                // Agrandissez l'image en multipliant les coordonnées de texture
                uv.x *= 0.8; // Agrandissez l'image horizontalement
                uv.y *= 0.8; // Agrandissez l'image verticalement

                // App
                // Ajustez la taille en multipliant les coordonnées de texture
                uv *= uScale;

                // Appliquez une déformation qui s'amplifie avec le temps
                if (uTime > 0.0) {
                    uv.x += uTime * (0.2 * sin(uv.y * 10.0));
                    uv.y += uTime * (0.2 * sin(uv.x * 10.0));
                }

                // Ajoutez un décalage latéral
                uv.x += uOffset * 2.0;

                vec4 texColor = texture2D(uTexture, uv);
                gl_FragColor = texColor;
            }
        `;

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTexture: { value: texture },
                uTime: { value: 0.0 },
                uOffset: { value: 0.0 },
                uScale: { value: new THREE.Vector2(1.0, 1.0) }, // Ajustez la taille ici
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
        });


        const plane = new THREE.Mesh(geometry, material);
        scene.add(plane);


  // Utilisation de GSAP pour l'animation de uTime

gsap.to(material.uniforms.uTime, {
    value:0.5, // Valeur finale
    duration: 5, // Durée de l'animation
    ease: "power1.inOut", // Fonction d'animation (facultatif)
});

gsap.to(material.uniforms.uOffset, {
            value: 0.1, // Valeur finale du décalage latéral
            duration: 2,
            ease: "power1.inOut",
            repeat: -1,
            yoyo: true,
        });




        
        let increasing = true; 
        function animate() {
            requestAnimationFrame(animate);
           // plane.rotation.x += 0.0001;
          //  plane.rotation.y += 0.0001;
  // Augmentez progressivement le temps pour l'animation
//   if (increasing) {
//                 material.uniforms.uTime.value += 0.0005;
//                 if (material.uniforms.uTime.value >= 1.0) {
//                     increasing = false;
//                 }
//             } else {
//                 material.uniforms.uTime.value -= 0.05;
//                 if (material.uniforms.uTime.value <= 0.0) {
//                     increasing = true;
//                 }
//             }


            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
