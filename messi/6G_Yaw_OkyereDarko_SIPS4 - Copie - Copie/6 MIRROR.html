          window.addEventListener('mousemove', onMouseMove);

document.addEventListener('mousemove', function (e) {

     var test = (mouse.y / window.innerHeight- 0.5)*rotationIntensity

});

    const mouse = { x: 0, y: 0 };

document.addEventListener('mousemove', function (e) {

renderer = new THREE.WebGLRenderer( { antialias: true,alpha:true } );
				renderer.setPixelRatio( window.devicePixelRatio );

				renderer.shadowMap.enabled = true;

				composer = new EffectComposer( renderer );
				document.body.appendChild( renderer.domElement );

			const renderScene = new RenderPass( scene, camera );
      const filmPass = new FilmPass( 0.3,0, 1928, false );

       // ajout de deux parametres dan le le fichier glitch = modifictaction du cosntructeur avec parametre amount et col_s

        glitchPass = new GlitchPass(64,0.005,0)//nouveau constructor 3 parametre, para2 = amouht,para3 col_s

        glitchPass.col_s = 0.0;

        gsap.to ( glitchPass,

              delay:0
            })

              duration:1,
              col_s:0.0,
              delay:0.5
            })



			composer.addPass( renderScene );
	

			composer.addPass( glitchPass );
