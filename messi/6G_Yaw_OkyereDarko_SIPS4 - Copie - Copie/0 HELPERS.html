      const scale = 10; // Modifiez cette valeur en fonction de la taille souhaitée

model.scale.set(scale, scale, scale);
model.position.y=-0.2



model.traverse((child) => {
    if (child instanceof THREE.Mesh) {
      child.material = material;

    const boxHelper = new THREE.BoxHelper(child, 0x00ff00); // Crée la boîte englobante pour cet objet
  scene.add(boxHelper);
  boxHelpers.push(boxHelper); 
  const axesHelper = new THREE.AxesHelper(50);
  axesHelper.position.copy(boxHelper.position);
  scene.add(axesHelper);
  });


  mixer = new THREE.AnimationMixer(model);

  action.play();

  totalDuration = clip.duration;///elles ont toute la meme duree

    end: "+=150%",
    scrub:true,
    markers: true
  }
});
