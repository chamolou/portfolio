<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Effet de Déformation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #changeTextureButton {
            position: fixed;
            top:10px;
            left:10px;
            background-color: brown;
            width: 100px;
            height: 30px;
            z-index: 9999999999999999999;
        }
    </style>
</head>
<body>
    <div id="changeTextureButton"></div>
    <div id="container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const aspect = window.innerWidth / window.innerHeight;
const size = Math.min(window.innerWidth, window.innerHeight) / 2; // Ajustez la taille selon vos besoins

const camera = new THREE.OrthographicCamera(
  -size * aspect,
  size * aspect,
  size,
  -size,
  0.1,
  1000
);camera.position.z = 2; 

        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

     
   const geometry = new THREE.PlaneGeometry(window.innerWidth ,window.innerHeight);


   ///texture image pour le shader 
   const textures = [
            new THREE.TextureLoader().load('cubemap/image2/46545.png'),
            new THREE.TextureLoader().load('cubemap/image2/23.png'), // Ajoutez ici le chemin de votre deuxième image
        // Ajoutez ici le chemin de votre troisième image
        ];
        
     let currentTextureIndex = 0;
    const textureCount = textures.length;

///textrure pour displacement

const displacementMapTexture = new THREE.TextureLoader().load('chemin/vers/displacement_map.png');

        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;
        const fragmentShader = `
    uniform sampler2D uTexture1;
    uniform sampler2D uTexture2;
    uniform float uTime; // Temps pour l'animation
    uniform float uOffset; // Décalage latéral

    uniform vec2 uScale; // Ajustez la taille
    uniform float uTransition;
    varying vec2 vUv;
    void main() {
        vec2 uv = vUv;
        vec2 texSize = vec2(1.0, ${window.innerHeight / window.innerWidth}); // Taille de texture relative à la fenêtre

        // Calculez la différence de rapport d'aspect
        vec2 aspectDifference = (vec2(1.0) - texSize) * 0.5;

        // Redimensionnez les coordonnées de texture avec correction d'aspect
        uv = uv * texSize + aspectDifference;

        // Ajustez la taille
        uv *= uScale*0.4;

   

        if (uTime > 0.0) {
            uv.x += uTime * (0.2 * sin(uv.y * 10.0));
            uv.y += uTime * (0.2 * sin(uv.x * 10.0));
        }

        uv.x += uOffset;

        vec4 texColor1 = texture2D(uTexture1, uv);
        vec4 texColor2 = texture2D(uTexture2, uv);

        // Utilisez un fondu enchaîné entre les deux textures
        gl_FragColor = mix(texColor1, texColor2, uTransition);
    }
`;




        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTexture1: { value: textures[0] },
                uTexture2: { value: textures[1] },
                uTime: { value: 0.0 },
                uOffset: { value: 0.1 },
          
                uTransition: { value: 0.0 },
                uScale: { value: new THREE.Vector2(2, 2.7) },
            },
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            transparent: true,
        });

        const plane = new THREE.Mesh(geometry, material);
        scene.add(plane);

        gsap.to(material.uniforms. uTransition, {
            value: 1,
            duration:1.5,
            ease: "power4.inOut",
            delay:1.5
            
        });


        //deforamtion des deux uv
        gsap.to(material.uniforms.uTime, {
            value: 1,
            duration: 2,
            ease: "power4.inOut",
            delay:1
        });

         gsap.to(material.uniforms.uTime, {
             value: 0,
            duration:1,
             ease: "power4.inOut",
            delay:2

            
         });


         gsap.to(material.uniforms.uOffset, {
             value:1,
            duration: 2,
             ease: "power4.inOut",
         
            delay:1
         });

         gsap.to(material.uniforms.uOffset, {
             value:0.1,
            duration: 2,
             ease: "power4.inOut",
         
            delay:3
         });
  
        const changeTextureButton = document.getElementById('changeTextureButton');

        changeTextureButton.addEventListener('click', () => {
            currentTextureIndex = (currentTextureIndex + 1) % textureCount;
            material.uniforms.uTexture2.value = textures[currentTextureIndex];
        });



        ///////////redimensionnemtn

// Redimensionnement du rendu lorsque la fenêtre change de taille
function onWindowResize() {
    const newWidth = window.innerWidth;
    const newHeight = window.innerHeight;

    // Mettez à jour la taille du rendu et la caméra
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(newWidth, newHeight);
}

// Écouteur d'événement pour le redimensionnement de la fenêtre
window.addEventListener('resize', onWindowResize);

// Appelez onWindowResize() une fois au début pour initialiser la taille du rendu
onWindowResize();







        let increasing = true; 
        function animate() {
            requestAnimationFrame(animate);
           // plane.rotation.x += 0.0001;
          //  plane.rotation.y += 0.0001;
  // Augmentez progressivement le temps pour l'animation
//   if (increasing) {
//                 material.uniforms.uTime.value += 0.0005;
//                 if (material.uniforms.uTime.value >= 1.0) {
//                     increasing = false;
//                 }
//             } else {
//                 material.uniforms.uTime.value -= 0.05;
//                 if (material.uniforms.uTime.value <= 0.0) {
//                     increasing = true;
//                 }
//             }


            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
