<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Effet de Déformation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #changeTextureButton {
            position: fixed;
            top:10px;
            left:10px;
            background-color: brown;
            width: 100px;
            height: 30px;
            z-index: 9999999999999999999;
        }
    </style>
</head>
<body>
    <div id="changeTextureButton"></div>
    <div id="container"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/stats.js"></script>


    <script>
        
        const scene = new THREE.Scene();
    

            const camera = new THREE.PerspectiveCamera(100, window.innerWidth / window.innerHeight, 0.1, 1000);
           camera.position.z = 55;


        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('container').appendChild(renderer.domElement);

     
 













        
      
  
    ///texture image pour le shader 
    const textures = [
            new THREE.TextureLoader().load('cubemap/image2/46545.png'),
            new THREE.TextureLoader().load('cubemap/image2/B0000412.JPG'), // Ajoutez ici le chemin de votre deuxième image
  
        ];
        
     let currentTextureIndex = 0;
    const textureCount = textures.length;
      
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;


        const fragmentShader = `
uniform sampler2D uTexture1;
uniform sampler2D uTexture2;
uniform float uMixValue;
uniform float uTime;
uniform float uAmplitudeDeformation;
uniform vec2 uScreenSize;
uniform vec2 uBGSize;
varying vec2 vUv;

void main() {

  vec2 uv = vUv;


  vec2 uv1 = uv; // Copie des coordonnées pour uTexture1
 uv.x += sin(uv1.y * 10.0 + uTime) * uAmplitudeDeformation;

 vec2 uv2 = uv; // Copie des coordonnées pour uTexture2
 uv2.x += sin(uv1.y * 10.0 + uTime) * uAmplitudeDeformation;



    
  
 
  vec2 s = uScreenSize;
  vec2 i = uBGSize;
  float rs = s.x / s.y;
  float ri = i.x / i.y;
  vec2 newSize = rs < ri ? vec2(i.x * s.y / i.y, s.y) : vec2(s.x, i.y * s.x / i.x);
  vec2 screenOffset = rs < ri ? vec2((newSize.x - s.x) / 2.0, 0.0) : vec2(0.0, (newSize.y - s.y) / 2.0);
  uv = (uv * s / newSize) + (screenOffset / s);

  vec4 texColor1 = texture2D(uTexture1, uv);
vec4 texColor2 = texture2D(uTexture2, uv);




  // Combinez les deux textures comme vous le souhaitez, par exemple, une simple interpolation :
  vec4 finalColor = mix(texColor1, texColor2, uMixValue) ;

  gl_FragColor = finalColor;
}
`;

// Créez un ShaderMaterial avec les uniforms pour la taille de l'écran et la taille de l'image

const uniforms = {
  uTexture1: { value: textures[0] },
  uTexture2: { value: textures[1] },
  uScreenSize: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
  uBGSize: { value: new THREE.Vector2(4128, 3096) },
  uMixValue: { value: 0.0 },
  uTime: { value: 0.0 },
  uAmplitudeDeformation: { value: 0.01 },
};

const material = new THREE.ShaderMaterial({
    uniforms: uniforms,
  vertexShader: vertexShader,
  fragmentShader: fragmentShader,
  transparent: true,
});


///aniamtion de treasnitionde texture
gsap.to (uniforms.  uMixValue,{value:1,duration:2})


// ///deforamtion de la vitesse de l'ondualtion speed
gsap.to(uniforms. uTime, { value: 15, duration: 1 });


// ///deforamtion de la vitesse de l'ondualtion amplitude
 gsap.from(uniforms. uAmplitudeDeformation, { value: 0.3, duration: 3, ease: "power4.out", });





// Fonction pour ajuster la géométrie du plan en fonction de la caméra
function planeFitPerspectiveCamera(x, camera, relativeZ = null) {
  const cameraZ = relativeZ !== null ? relativeZ : camera.position.z;
  const distance = cameraZ - x.position.z;
  const vFov = camera.fov * (Math.PI / 190);
  const scaleY = 2 * Math.tan(vFov / 2) * distance;
  const scaleX = scaleY * camera.aspect;

 x.scale.set(scaleX*1.1, scaleY*1.1, 1);
  scene.add(x);
}

// Créez le plan
const geometry = new THREE.PlaneGeometry(1, 1); // Utilisez une géométrie de base (1x1)
const plane = new THREE.Mesh(geometry, material);
// Ajustez la géométrie du plan en fonction de la caméra













        ///////////redimensionnemtn

// Redimensionnement du rendu lorsque la fenêtre change de taille
function onWindowResize() {
    const newWidth = window.innerWidth;
    const newHeight = window.innerHeight;

    // Mettez à jour la taille du rendu et la caméra
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
 planeFitPerspectiveCamera(plane, camera);
    renderer.setSize(newWidth, newHeight);

      // Mettez à jour les uniforms de la taille de l'écran dans le shader
  material.uniforms.uScreenSize.value.x = newWidth;
  material.uniforms.uScreenSize.value.y = newHeight;
}

// Écouteur d'événement pour le redimensionnement de la fenêtre
window.addEventListener('resize', onWindowResize);

// Appelez onWindowResize() une fois au début pour initialiser la taille du rendu
onWindowResize();







        const stats = new Stats();
        document.body.appendChild( stats.dom ).setAttribute("id", "democlass"); ;
			
            democlass.style.top='750px'
            democlass.style.left='80px'
    democlass.style.opacity=1;



    let increasing = true; 

        function animate() {
        

            const time2 =  performance.now() * 0.0001;



///////////deformatino
          uniforms.uTime.value += 0.005; 
     
            stats.begin()
            renderer.render(scene, camera);
            stats.end();
            requestAnimationFrame(animate);
        }

        animate();

           


    </script>
</body>
</html>
